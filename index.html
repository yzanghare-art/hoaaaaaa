<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thương bé lắm Trân ạ ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: radial-gradient(circle at center, #fff0f5 0%, #ffd1dc 60%, #f8bbd0 100%);
        }

        /* Lớp ánh sáng lung linh ở trung tâm */
        .glow-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,182,193,0.6) 0%, rgba(255,255,255,0) 70%);
            z-index: 1;
            pointer-events: none;
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        /* Nền chứa hoa trang trí */
        .decor-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Hoa ly lớn trang trí 4 góc */
        .decor-flower {
            position: absolute;
            width: 260px;
            height: auto;
            opacity: 0.9;
            filter: drop-shadow(0 10px 20px rgba(255, 105, 180, 0.3));
        }

        .flower-top-left { top: -20px; left: -20px; transform: rotate(15deg); }
        .flower-top-right { top: -20px; right: -20px; transform: rotate(-15deg) scaleX(-1); }
        .flower-bottom-left { bottom: -20px; left: -20px; transform: rotate(-10deg); }
        .flower-bottom-right { bottom: -20px; right: -20px; transform: rotate(10deg) scaleX(-1); }

        /* Icon dễ thương trôi nổi */
        .cute-sticker {
            position: absolute;
            font-size: 2.8rem;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
            animation: float 4s ease-in-out infinite;
        }

        .st-1 { top: 12%; left: 20%; animation-delay: 0s; }
        .st-2 { top: 15%; right: 22%; animation-delay: 1s; }
        .st-3 { bottom: 15%; left: 18%; animation-delay: 2s; }
        .st-4 { bottom: 18%; right: 20%; animation-delay: 1.5s; }

        /* Khung nội dung chính ở giữa */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        /* Hộp chữ trung tâm */
        .card-message {
            background: rgba(45, 45, 45, 0.78);
            color: #ffffff;
            font-size: 3rem;
            font-weight: 700;
            padding: 28px 56px;
            border-radius: 30px;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25), 0 0 25px rgba(255, 192, 203, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            gap: 18px;
            animation: cardPulse 3s ease-in-out infinite;
            letter-spacing: 1px;
        }

        .heart {
            color: #ff2a6d;
            font-size: 3.5rem;
            display: inline-block;
            animation: heartBeat 1.2s ease-in-out infinite;
            filter: drop-shadow(0 0 12px #ff2a6d);
        }

        /* Hiệu ứng vật thể rơi */
        .falling-item {
            position: fixed;
            top: -10%;
            z-index: 3;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        @keyframes cardPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 15px 40px rgba(0,0,0,0.25), 0 0 25px rgba(255, 192, 203, 0.5); }
            50% { transform: scale(1.03); box-shadow: 0 20px 50px rgba(0,0,0,0.3), 0 0 35px rgba(255, 105, 180, 0.8); }
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.18); }
            50% { transform: scale(1); }
            75% { transform: scale(1.18); }
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .card-message {
                font-size: 1.6rem;
                padding: 18px 30px;
                gap: 10px;
            }
            .heart { font-size: 2rem; }
            .decor-flower { width: 140px; }
            .glow-overlay { width: 300px; height: 300px; }
        }
    </style>
</head>
<body>

    <div class="glow-overlay"></div>

    <!-- Trang trí 4 góc và icon -->
    <div class="decor-bg">
        <img class="decor-flower flower-top-left" src="https://images.fineartamerica.com/images/artworkimages/mediumlarge/3/stargazer-lily-cut-out-png-transparent-background-flower-png-flora.png" alt="hoa ly">
        <img class="decor-flower flower-top-right" src="https://images.fineartamerica.com/images/artworkimages/mediumlarge/3/stargazer-lily-cut-out-png-transparent-background-flower-png-flora.png" alt="hoa ly">
        <img class="decor-flower flower-bottom-left" src="https://images.fineartamerica.com/images/artworkimages/mediumlarge/3/stargazer-lily-cut-out-png-transparent-background-flower-png-flora.png" alt="hoa ly">
        <img class="decor-flower flower-bottom-right" src="https://images.fineartamerica.com/images/artworkimages/mediumlarge/3/stargazer-lily-cut-out-png-transparent-background-flower-png-flora.png" alt="hoa ly">

        <span class="cute-sticker st-1">☁️</span>
        <span class="cute-sticker st-2">🐰</span>
        <span class="cute-sticker st-3">🐱</span>
        <span class="cute-sticker st-4">✨</span>
    </div>

    <!-- Khung chữ trung tâm -->
    <div class="container">
        <div class="card-message">
            <span>Yêu bé lắm Trân ạ</span>
            <span class="heart">❤️</span>
        </div>
    </div>

    <!-- Nhạc nền ẩn với thuộc tính autoplay và muted khởi tạo -->
    <audio id="bgMusic" autoplay loop preload="auto">
        <source src="https://files.catbox.moe/k2n324.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bgMusic');

        // Hàm cố gắng bật nhạc ngay khi load
        function playAudio() {
            audio.play().then(() => {
                // Đã phát thành công
                removeEvents();
            }).catch(error => {
                // Nếu trình duyệt chặn, chờ bất kỳ tương tác nhỏ nào từ chuột/màn hình
            });
        }

        function removeEvents() {
            ['click', 'touchstart', 'mousemove', 'scroll', 'keydown'].forEach(event => {
                document.removeEventListener(event, playAudio);
            });
        }

        // Gọi ngay lập tức khi script chạy
        playAudio();

        // Đăng ký mọi cử động nhỏ nhất từ người dùng (di chuột, cuộn, chạm...)
        ['click', 'touchstart', 'mousemove', 'scroll', 'keydown'].forEach(event => {
            document.addEventListener(event, playAudio, { once: true });
        });

        // Tạo hiệu ứng tim, hoa ly và ngôi sao rơi
        function createFallingItem() {
            const items = ['🌸', '💖', '✨', '🌺', '💕', '🌷', '⭐'];
            const item = document.createElement('div');
            item.classList.add('falling-item');
            item.innerText = items[Math.floor(Math.random() * items.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = Math.random() * 3 + 3.5 + 's';
            item.style.fontSize = Math.random() * 18 + 18 + 'px';
            item.style.opacity = Math.random() * 0.8 + 0.3;
            
            document.body.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, 6500);
        }

        setInterval(createFallingItem, 300);
    </script>

</body>
</html>
