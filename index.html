<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Trân ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #ffebee 0%, #fce4ec 50%, #f3e5f5 100%);
        }

        /* Nền chứa họa tiết trang trí */
        .decor-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Hoa ly trang trí 4 góc */
        .decor-flower {
            position: absolute;
            width: 200px;
            height: auto;
            opacity: 0.95;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.1));
        }

        .flower-top-left { top: -10px; left: -10px; transform: rotate(10deg); }
        .flower-top-right { top: -10px; right: -10px; transform: rotate(-10deg) scaleX(-1); }
        .flower-bottom-left { bottom: -10px; left: -10px; transform: rotate(-10deg); }
        .flower-bottom-right { bottom: -10px; right: -10px; transform: rotate(10deg) scaleX(-1); }

        /* Icon dễ thương trôi nổi */
        .cute-icon {
            position: absolute;
            font-size: 2.2rem;
            animation: float 4s ease-in-out infinite;
        }

        .icon-1 { top: 15%; left: 25%; animation-delay: 0s; }
        .icon-2 { top: 18%; right: 28%; animation-delay: 1s; }
        .icon-3 { bottom: 20%; left: 22%; animation-delay: 2s; }
        .icon-4 { bottom: 22%; right: 25%; animation-delay: 1.5s; }

        /* Khung nội dung chính ở giữa */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        /* Hộp thông điệp giống hệt hình mẫu */
        .card-message {
            background: rgba(60, 60, 60, 0.75);
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 700;
            padding: 22px 42px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            gap: 15px;
            animation: pulse 2.5s ease-in-out infinite;
        }

        .heart {
            color: #ff3366;
            font-size: 2.8rem;
            filter: drop-shadow(0 0 6px rgba(255, 51, 102, 0.8));
        }

        /* Nút phát nhạc */
        .play-btn {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.9);
            color: #d81b60;
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.25);
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            transform: scale(1.06);
            background: #ffffff;
        }

        /* Hiệu ứng hoa & tim rơi */
        .falling-item {
            position: fixed;
            top: -10%;
            z-index: 2;
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .card-message {
                font-size: 1.5rem;
                padding: 16px 26px;
            }
            .heart { font-size: 1.8rem; }
            .decor-flower { width: 120px; }
        }
    </style>
</head>
<body>

    <!-- Trang trí 4 góc và icon -->
    <div class="decor-bg">
        <img class="decor-flower flower-top-left" src="https://images.fineartamerica.com/images/artworkimages/mediumlarge/3/stargazer-lily-cut-out-png-transparent-background-flower-png-flora.png" alt="hoa ly">
        <img class="decor-flower flower-top-right" src="https://images.fineartamerica.com/images/artworkimages/mediumlarge/3/stargazer-lily-cut-out-png-transparent-background-flower-png-flora.png" alt="hoa ly">
        <img class="decor-flower flower-bottom-left" src="https://images.fineartamerica.com/images/artworkimages/mediumlarge/3/stargazer-lily-cut-out-png-transparent-background-flower-png-flora.png" alt="hoa ly">
        <img class="decor-flower flower-bottom-right" src="https://images.fineartamerica.com/images/artworkimages/mediumlarge/3/stargazer-lily-cut-out-png-transparent-background-flower-png-flora.png" alt="hoa ly">

        <span class="cute-icon icon-1">☁️</span>
        <span class="cute-icon icon-2">🐰</span>
        <span class="cute-icon icon-3">🐱</span>
        <span class="cute-icon icon-4">✨</span>
    </div>

    <!-- Khung chữ trung tâm -->
    <div class="container">
        <div class="card-message">
            <span>Yêu bé lắm Trân ạ</span>
            <span class="heart">❤️</span>
        </div>
        <button class="play-btn" id="musicBtn" onclick="togglePlay()">🎵 Phát Nhạc Nền</button>
    </div>

    <!-- Nhạc nền ẩn từ tệp âm thanh chính xác của bài hát -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://files.catbox.moe/k2n324.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bgMusic');
        const btn = document.getElementById('musicBtn');
        let isPlaying = false;

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                btn.innerHTML = '🎵 Bật Nhạc Nền';
            } else {
                audio.play();
                btn.innerHTML = '⏸ Tắt Nhạc Nền';
            }
            isPlaying = !isPlaying;
        }

        // Tự động phát nhạc khi chạm vào màn hình
        document.addEventListener('click', function() {
            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    btn.innerHTML = '⏸ Tắt Nhạc Nền';
                }).catch(e => console.log(e));
            }
        }, { once: true });

        // Tạo hiệu ứng tim & hoa rơi
        function createFallingItem() {
            const items = ['🌸', '💖', '✨', '🌺', '💕'];
            const item = document.createElement('div');
            item.classList.add('falling-item');
            item.innerText = items[Math.floor(Math.random() * items.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = Math.random() * 3 + 4 + 's';
            item.style.fontSize = Math.random() * 15 + 18 + 'px';
            item.style.opacity = Math.random() * 0.7 + 0.3;
            
            document.body.appendChild(item);

            setTimeout(() => {
                item.remove();
            }, 7000);
        }

        setInterval(createFallingItem, 400);
    </script>

</body>
</html>
